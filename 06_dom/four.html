

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS4</title>
</head>
<body style=" background-color: #212121; color:#fff">
    <ul class="language">
        <li>JavaScript</li>
    </ul>

</body>
<script>

//Here in this Particular file ,we createda list and performed DOM manipulation on it like adding new items,edit and remove

    function addLanguage(langName){
     const listItem= document.createElement('li')
     listItem.innerHTML=`${langName}`
     document.querySelector('.language').appendChild(listItem)
    }

    addLanguage("Python")
    addLanguage("Java")
    // addLanguage("C++")

function addOptiLanguage(langName){
    const listItem=document.createElement('li')
    listItem.appendChild(document.createTextNode(langName))
    document.querySelector('.language').appendChild(listItem)
}
addOptiLanguage("GoLang")


//Edit 
const secondLang=document.querySelector("li:nth-child(3)")
// secondLang.innerHTML="Mojo"
const newli=document.createElement('li')
newli.textContent="TypeScript"
secondLang.replaceWith(newli)
 
 //Edit with outer Html
const firstLang=document.querySelector("li:first-child")
firstLang.outerHTML= '<li>Ruby</li>'
//Remove
const lastLang= document.querySelector("li:last-child")
lastLang.remove()

</script>
</html>
